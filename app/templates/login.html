<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accesso — Gestionale</title>
    <link rel="stylesheet" href="/static/style.css?v={{ versione_css() }}">
</head>
<body>
    <div class="login-scena">
        <div class="login-marchio">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.8"/></svg>
            <strong>Gestionale</strong>
        </div>
        <div class="card login-card">
            <h1>Accedi per continuare</h1>
            {% if errore %}
            <p class="errore" role="alert">{{ errore }}</p>
            {% endif %}
            <form method="post" action="/login-form">
                <label>Email <input type="email" name="email" autocomplete="username" required autofocus></label>
                <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
                <button type="submit">Accedi</button>
            </form>
        </div>
    </div>
</body>
</html>
