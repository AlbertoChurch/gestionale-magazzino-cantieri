<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambia password</title>
    <link rel="stylesheet" href="/static/style.css?v={{ versione_css() }}">
</head>
<body>
    {% include "_nav.html" %}
    <main>
        <h1>Cambia la tua password</h1>
        {% if errore %}
        <p class="errore" role="alert">{{ errore }}</p>
        {% endif %}
        <div class="card">
        <form method="post" action="/cambia-password" id="form-password">
            <label>Password attuale <input type="password" name="password_attuale" autocomplete="current-password" required autofocus></label>
            <label>Nuova password <input type="password" name="password_nuova" id="password_nuova" autocomplete="new-password" required></label>
            <label>Ripeti la nuova password <input type="password" id="password_ripeti" autocomplete="new-password" required></label>
            <button type="submit">Cambia password</button>
        </form>
        </div>
    </main>
    <script>
        const nuova = document.getElementById('password_nuova');
        const ripeti = document.getElementById('password_ripeti');
        function controllaCoincidenza() {
            ripeti.setCustomValidity(nuova.value === ripeti.value ? '' : 'Le due password non coincidono');
        }
        nuova.addEventListener('input', controllaCoincidenza);
        ripeti.addEventListener('input', controllaCoincidenza);
    </script>
</body>
</html>
