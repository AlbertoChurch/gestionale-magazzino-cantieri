<!DOCTYPE html>
<html>
<head>
    <title>Cambia password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "_nav.html" %}
    <main>
        <h1>Cambia la tua password</h1>
        {% if errore %}
        <p class="errore">{{ errore }}</p>
        {% endif %}
        <div class="card">
        <form method="post" action="/cambia-password">
            <label>Password attuale <input type="password" name="password_attuale"></label>
            <label>Nuova password <input type="password" name="password_nuova"></label>
            <button type="submit">Cambia password</button>
        </form>
        </div>
    </main>
</body>
</html>
