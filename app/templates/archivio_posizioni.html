<!DOCTYPE html>
<html>
<head>
    <title>Archivio - Posizioni chiuse</title>
    <link rel="stylesheet" href="/static/style.css?v={{ versione_css() }}">
</head>
<body>
    {% include "_nav.html" %}
    <main>
        <h1>Cantieri/magazzini chiusi</h1>
        <div class="card">
        <table>
            <tr><th>Nome</th><th>Tipo</th><th>Indirizzo</th><th>Aperto dal</th><th>Chiuso il</th><th></th></tr>
            {% for posizione in posizioni %}
            <tr>
                <td>{{ posizione.nome }}</td>
                <td>{{ posizione.tipo_posizione.nome }}</td>
                <td>{{ posizione.indirizzo or "—" }}</td>
                <td>{{ posizione.data_apertura or "—" }}</td>
                <td>{{ posizione.data_chiusura }}</td>
                <td>
                    <form method="post" action="/posizioni/{{ posizione.id }}/riapri" style="margin:0;">
                        <button type="submit">Riapri</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        </div>
    </main>
</body>
</html>
