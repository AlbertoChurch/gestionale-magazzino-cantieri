<!DOCTYPE html>
<html>
<head>
    <title>Nuovo account</title>
    <link rel="stylesheet" href="/static/style.css?v={{ versione_css() }}">
</head>
<body>
    {% include "_nav.html" %}
    <main>
        <h1>Crea nuovo account</h1>
        {% if errore %}
        <p class="errore">{{ errore }}</p>
        {% endif %}
        <div class="card">
        <form method="post" action="/utenti/nuovo">
            <label>Nome <input type="text" name="nome"></label>
            <label>Cognome <input type="text" name="cognome"></label>
            <label>Email <input type="email" name="email"></label>
            <label>Password provvisoria <input type="password" name="password"></label>
            <label>Ruolo
                <select name="ruolo_id">
                    {% for ruolo in ruoli %}
                    <option value="{{ ruolo.id }}">{{ ruolo.nome }}</option>
                    {% endfor %}
                </select>
            </label>
            <button type="submit">Crea account</button>
        </form>
        </div>
    </main>
</body>
</html>
