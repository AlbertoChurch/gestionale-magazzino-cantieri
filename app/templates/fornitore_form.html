<!DOCTYPE html>
<html>
<head>
    <title>{{ "Modifica fornitore" if fornitore else "Nuovo fornitore" }}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ versione_css() }}">
</head>
<body>
    {% include "_nav.html" %}
    <main>
        <h1>{{ "Modifica fornitore" if fornitore else "Nuovo fornitore" }}</h1>
        {% if errore %}
        <p class="errore">{{ errore }}</p>
        {% endif %}
        <div class="card">
        <form method="post" action="{{ '/fornitori/' ~ fornitore.id ~ '/modifica' if fornitore else '/fornitori/nuovo' }}">
            <label>Nome <input type="text" name="nome" value="{{ fornitore.nome if fornitore else '' }}"></label>
            <label>Referente 1 <input type="text" name="referente_1" value="{{ fornitore.referente_1 if fornitore else '' }}"></label>
            <label>Referente 2 <input type="text" name="referente_2" value="{{ fornitore.referente_2 if fornitore else '' }}"></label>
            <label>Email generale <input type="email" name="email_generale" value="{{ fornitore.email_generale if fornitore else '' }}"></label>
            <label>Email commerciale <input type="email" name="email_commerciale" value="{{ fornitore.email_commerciale if fornitore else '' }}"></label>
            <label>Email tecnico <input type="email" name="email_tecnico" value="{{ fornitore.email_tecnico if fornitore else '' }}"></label>
            <label>Email amministrazione <input type="email" name="email_amministrazione" value="{{ fornitore.email_amministrazione if fornitore else '' }}"></label>
            <label>Telefono fisso <input type="text" name="telefono_fisso" value="{{ fornitore.telefono_fisso if fornitore else '' }}"></label>
            <label>Cellulare 1 <input type="text" name="cellulare_1" value="{{ fornitore.cellulare_1 if fornitore else '' }}"></label>
            <label>Cellulare 2 <input type="text" name="cellulare_2" value="{{ fornitore.cellulare_2 if fornitore else '' }}"></label>
            <button type="submit">{{ "Salva" if fornitore else "Crea" }}</button>
            {% if fornitore %}<a href="/fornitori/nuovo"><button type="button" class="btn-secondario">Annulla</button></a>{% endif %}
        </form>
        </div>

        <div class="card">
            <h2>Fornitori già inseriti</h2>
            <ul class="lista-anagrafica">
                {% for f in fornitori %}
                <li>
                    <span class="nome-elemento"><a href="/fornitori/{{ f.id }}">{{ f.nome }}</a></span>
                    <div class="azioni-riga">
                        <a href="/fornitori/{{ f.id }}/modifica"><button type="button" class="btn-secondario">Modifica</button></a>
                        <form method="post" action="/fornitori/{{ f.id }}/elimina">
                            <button type="button" class="btn-secondario" onclick="chiediConferma(this)">Elimina</button>
                        </form>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </main>
</body>
</html>
